name: Rust checks
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --check
      - run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked
      - run: cargo +1.97.1 run --locked -- bench
