name: Rust checks
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --check
      - run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked
      - run: cargo +1.97.1 run --locked -- bench
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-release.mjs
      - run: node --test scripts/check-release.test.mjs scripts/verify-holdout.test.mjs
      - run: npx --yes dotdog@1.0.0 validate
      - run: npx --yes dotdog@1.0.0 check --json
      - run: npx --yes dotdog@1.0.0 scenario-check Benchmark --project architecture-lab --json
      - run: npx --yes dotdog@1.0.0 reference-check --project architecture-lab --json
